<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)"/></pattern><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-20px) translateX(15px);opacity:.7}}@keyframes radarScan{0%{transform:rotate(0deg)}}@keyframes trackPulse{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-40}}@keyframes beaconBlink{0%{r:4px;opacity:1}50%{r:8px;opacity:.4}}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.badge-sub,.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.badge-sub{font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.radar-beam{transform-origin:1040px 180px;animation:radarScan 9s linear infinite}.pulse-orb{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out 1.5s infinite}.particle-3{animation:floatParticle 7s ease-in-out 3s infinite}.animated-track{stroke-dasharray:8 6;animation:trackPulse 4s linear infinite}.beacon-dot{animation:beaconBlink 2s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="360" fill="url(#grid)" rx="16"/><circle cx="1040" cy="180" r="120" fill="url(#accentCyan)" class="pulse-orb" filter="url(#glow)" opacity=".15"/><circle cx="150" cy="80" r="90" fill="#3b82f6" class="pulse-orb" filter="url(#glow)" opacity=".12"/><circle cx="580" cy="300" r="80" fill="#8b5cf6" class="pulse-orb" filter="url(#glow)" opacity=".1"/><g opacity=".85"><circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-opacity=".2" stroke-width="1.5"/><circle cx="1040" cy="180" r="75" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.5"/><circle cx="1040" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5"/><line x1="1040" x2="1145" y1="180" y2="180" stroke="url(#accentCyan)" stroke-linecap="round" stroke-width="2.5" class="radar-beam"/><path fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="2.5" d="M 860 260 L 930 260 L 980 200 L 1030 200 L 1080 240 L 1140 240" class="animated-track"/><path fill="none" stroke="#818cf8" stroke-opacity=".5" stroke-width="2.5" d="M 870 120 L 940 120 L 990 160 L 1040 160 L 1090 120 L 1150 120" class="animated-track"/><circle cx="980" cy="200" r="5" fill="#38bdf8" class="beacon-dot" filter="url(#subtleGlow)"/><circle cx="1030" cy="200" r="4" fill="#34d399"/><circle cx="990" cy="160" r="4" fill="#a78bfa"/><circle cx="1040" cy="160" r="5" fill="#f43f5e" class="beacon-dot"/><g opacity=".9" transform="translate(860, 160)"><rect width="55" hei