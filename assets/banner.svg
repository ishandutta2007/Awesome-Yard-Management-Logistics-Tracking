<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <!-- Glowing accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic animations in the background and indicators */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-20px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes trackPulse {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: -40; }
    }
    @keyframes beaconBlink {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 8px; opacity: 0.4; }
    }

    .radar-beam {
      transform-origin: 1040px 180px;
      animation: radarScan 9s linear infinite;
    }
    .pulse-orb {
      animation: pulseGlow 5s ease-in-out infinite;
      transform-origin: center;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out 1.5s infinite; }
    .particle-3 { animation: floatParticle 7s ease-in-out 3s infinite; }
    .animated-track {
      stroke-dasharray: 8 6;
      animation: trackPulse 4s linear infinite;
    }
    .beacon-dot {
      animation: beaconBlink 2s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="1040" cy="180" r="120" fill="url(#accentCyan)" opacity="0.15" filter="url(#glow)" class="pulse-orb" />
  <circle cx="150" cy="80" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow)" class="pulse-orb" />
  <circle cx="580" cy="300" r="80" fill="#8b5cf6" opacity="0.1" filter="url(#glow)" class="pulse-orb" />

  <!-- Logistics / Yard Graphic Elements (Right side, non-intrusive) -->
  <g opacity="0.85">
    <!-- Radar concentric rings -->
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Rotating Radar Scan Line -->
    <line x1="1040" y1="180" x2="1145" y2="180" stroke="url(#accentCyan)" stroke-width="2.5" class="radar-beam" stroke-linecap="round" />
    
    <!-- Yard Gate & Lane Flow Routes -->
    <path d="M 860 260 L 930 260 L 980 200 L 1030 200 L 1080 240 L 1140 240" fill="none" stroke="#38bdf8" stroke-width="2.5" class="animated-track" stroke-opacity="0.6" />
    <path d="M 870 120 L 940 120 L 990 160 L 1040 160 L 1090 120 L 1150 120" fill="none" stroke="#818cf8" stroke-width="2.5" class="animated-track" stroke-opacity="0.5" />

    <!-- Dock/Slot Nodes -->
    <circle cx="980" cy="200" r="5" fill="#38bdf8" class="beacon-dot" filter="url(#subtleGlow)" />
    <circle cx="1030" cy="200" r="4" fill="#34d399" />
    <circle cx="990" cy="160" r="4" fill="#a78bfa" />
    <circle cx="1040" cy="160" r="5" fill="#f43f5e" class="beacon-dot" />

    <!-- Yard Trailer/Container Icons (Stylized Cards) -->
    <g transform="translate(860, 160)" opacity="0.9">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="27" y="20" fill="#38bdf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">YARD</text>
    </g>
    <g transform="translate(1070, 70)" opacity="0.85">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <text x="27" y="20" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">RFID</text>
    </g>
    <g transform="translate(900, 70)" opacity="0.85">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="27" y="20" fill="#f59e0b" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">DOCK</text>
    </g>
    <g transform="translate(1070, 265)" opacity="0.85">
      <rect x="0" y="0" width="55" height="30" rx="5" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="27" y="20" fill="#818cf8" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">GATE</text>
    </g>
  </g>

  <!-- Foreground Dynamic Floating Particles (Subtle) -->
  <circle cx="300" cy="90" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="700" cy="70" r="2.5" fill="#818cf8" class="particle-2" />
  <circle cx="520" cy="270" r="3" fill="#34d399" class="particle-3" />

  <!-- Clean Foreground Content Area (Guaranteed 100% Legibility & Hierarchy) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 68)">
      <rect width="215" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="14" r="5" fill="#38bdf8" />
      <text x="32" y="19" fill="#38bdf8" class="badge-sub">CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Awesome Yard Management
    </text>
    <text x="0" y="192" class="title-text" fill="url(#accentCyan)">
      &amp; Logistics Tracking
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">
      Top Enterprise YMS, Dock Scheduling &amp; Open-Source Telematics Solutions
    </text>

    <!-- Feature Tags / Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1: Trailer & Gate Automation -->
      <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" class="pill-text">Gate &amp; Vision AI</text>

      <!-- Pill 2: Dock Appointment Scheduling -->
      <rect x="180" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="198" cy="17" r="4" fill="#34d399" />
      <text x="212" y="22" class="pill-text">Dock Scheduling</text>

      <!-- Pill 3: RFID & Telematics -->
      <rect x="357" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="375" cy="17" r="4" fill="#f59e0b" />
      <text x="389" y="22" class="pill-text">RFID Telematics</text>

      <!-- Pill 4: Open-Source Systems -->
      <rect x="529" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="547" cy="17" r="4" fill="#a78bfa" />
      <text x="561" y="22" class="pill-text">Open Source</text>
    </g>
  </g>
</svg>